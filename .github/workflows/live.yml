# Checks the provider against the real databazeknih.cz once a day, so a change to the site's pages
# fails here, and GitHub emails the failure, before a user meets it. The offline tests cannot catch
# this: their fixtures are saved copies of the pages.
name: Live

on:
  schedule:
    # 05:17 UTC, off the hour when scheduled runs pile up.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One test at a time, so the site sees one provider's worth of requests.
      - run: cargo test live -- --ignored --test-threads=1
